# ---- docker-compose.yml ----
# AIDRA - Artificial Intelligence In-orbit Data pRocessing Assessment
# All 5 services: app, db, grafana, prometheus, loki

services:
  # ====== APP PRINCIPAL ======
  aidra-app:
    build:
      context: .
      args:
        AIDRA_COMMIT_SHA: ${AIDRA_COMMIT_SHA:-unknown}
    container_name: aidra-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aidra:${DB_PASSWORD}@aidra-db:5432/aidra
      - COPERNICUS_USER=${COPERNICUS_USER}
      - COPERNICUS_PASSWORD=${COPERNICUS_PASSWORD}
      - MODELS_DIR=/app/models
      - IMAGES_DIR=/data/images
      - DEFAULT_MODEL=${DEFAULT_MODEL:-vesseltracker-sar-yolov8}
      - DEFAULT_MODEL_VERSION=${DEFAULT_MODEL_VERSION:-v1.0}
      - LOG_LEVEL=INFO
      # Aggregate Copernicus download ceiling in Mbps; 0 to uncap locally.
      - DOWNLOAD_RATE_LIMIT_MBPS=${DOWNLOAD_RATE_LIMIT_MBPS:-20}
      - PROMETHEUS_ENABLED=true
      - LOKI_URL=http://aidra-loki:3100
      - AIDRA_COMMIT_SHA=${AIDRA_COMMIT_SHA:-unknown}
    volumes:
      - ./models:/app/models
      - aidra-images:/data/images
      - aidra-thumbnails:/data/thumbnails
      - aidra-interpretability:/data/interpretability
    depends_on:
      aidra-db:
        condition: service_healthy
    networks:
      - aidra-net
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          memory: 4G

  # ====== BASE DE DATOS ======
  aidra-db:
    image: postgis/postgis:16-3.4-alpine
    container_name: aidra-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=aidra
      - POSTGRES_USER=aidra
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - aidra-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidra -d aidra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aidra-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ====== GRAFANA ======
  aidra-grafana:
    image: grafana/grafana-oss:11.0.0
    container_name: aidra-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED:-false}
      - GF_AUTH_ANONYMOUS_ORG_NAME=${GRAFANA_ANONYMOUS_ORG_NAME:-Main Org.}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_HIDE_VERSION=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_EXPLORE_ENABLED=false
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/00-home.json
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - aidra-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - aidra-db
      - aidra-prom
    networks:
      - aidra-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ====== PROMETHEUS ======
  aidra-prom:
    image: prom/prometheus:v2.53.0
    container_name: aidra-prom
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - aidra-prom-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=5GB'
    networks:
      - aidra-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ====== LOKI ======
  aidra-loki:
    image: grafana/loki:3.1.0
    container_name: aidra-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - aidra-loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - aidra-net
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M

  # ====== MCP SERVER (agents) — opt-in: docker compose --profile agent up ======
  # Streamable HTTP on 127.0.0.1:8765/mcp, a thin client of aidra-app's API
  # (same auth scopes, audit log and validation as any other client).
  #   claude mcp add --transport http aidra http://localhost:8765/mcp
  # Read-only by default; AIDRA_MCP_MODE=operator + a run-scoped
  # AIDRA_MCP_TOKEN (listed in AIDRA_API_TOKENS) enables the write tools.
  aidra-mcp:
    # Same Dockerfile as aidra-app (layers are cached); only src/mcp_server is imported at runtime.
    build:
      context: .
      args:
        AIDRA_COMMIT_SHA: ${AIDRA_COMMIT_SHA:-unknown}
    container_name: aidra-mcp
    profiles: ["agent"]
    restart: unless-stopped
    command: ["python", "-m", "src.mcp_server", "--transport", "http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      - AIDRA_API_URL=http://aidra-app:8000
      - AIDRA_MCP_MODE=${AIDRA_MCP_MODE:-read-only}
      - AIDRA_API_TOKEN=${AIDRA_MCP_TOKEN:-}
      - AIDRA_MCP_CLIENT_NAME=aidra-mcp/1.0.0 (compose)
    depends_on:
      - aidra-app
    networks:
      - aidra-net
    deploy:
      resources:
        limits:
          memory: 256M

  # Promtail retirado: la app empuja a Loki directamente vía LOKI_URL
  # (src/observability/loki_logger.LokiHandler). Mantenerlo aqui duplicaria
  # cada linea en Loki y divergiria de produccion, que nunca lo tuvo por no
  # montar docker.sock en un host compartido. Ver docker-compose.coolify.yml.

volumes:
  aidra-db-data:        # Persistencia PostgreSQL
  aidra-grafana-data:   # Dashboards y configuracion Grafana
  aidra-prom-data:      # Datos historicos Prometheus
  aidra-loki-data:      # Logs historicos
  aidra-images:         # Cache temporal de imagenes satelitales
  aidra-thumbnails:     # SAR detection thumbnails (wow #1)
  aidra-interpretability:  # Grad-CAM + CFAR heatmaps (D4 annex, I-AIA-2)

networks:
  aidra-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
